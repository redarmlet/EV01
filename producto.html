<body>
    <header>

        <ul id="dropdown1" class="dropdown-content">
            <li><a href="#!">Registrarse</a></li>
            <li class="divider"></li>
            <li><a href="#!">Iniciar Sesión</a></li>
            <li class="divider"></li>
        </ul>
        <nav>
            <div class="nav-wrapper">
            <a href="index.html" class="brand-logo"><img src="img/logo01.webp" alt="Pastelería Mil Sabores" class="logo"></a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blog.html">Blogs</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li>
                    <a id="carrito-boton" href="#!" aria-label="Abrir carrito">
                        <i class="material-icons">shopping_cart</i>
                        <span id="carrito-contador" class="carrito-contador oculto">0</span>
                    </a>
                </li>
                <li><a class="dropdown-trigger" href="#!" data-target="dropdown1">Iniciar Sesión<i class="material-icons right">arrow_drop_down</i></a></li>

        </nav>
    </header>

    <main>
        <div class="menu">
            <div id="detalle-producto" class="detalle-producto"></div>
        </div>

    <!-- Panel lateral del carrito (deslizante desde la derecha) -->
    <div id="carrito-overlay" class="carrito-overlay"></div>
    <aside id="carrito-panel" class="carrito-panel">
        <div class="carrito-panel-header">
            <h4>Tu carro</h4>
            <button id="carrito-cerrar" class="material-icons carrito-cerrar" aria-label="Cerrar carrito">close</button>
        </div>
        <div id="carrito-lista" class="carrito-lista"></div>
        <div class="carrito-panel-footer">
            <div class="carrito-total-fila">
                <span>Total</span>
                <span id="carrito-total">$ 0</span>
            </div>
            <button id="carrito-finalizar" class="btn carrito-finalizar">Finalizar compra</button>
        </div>
    </aside>

    <footer class="page-footer">
        <div class="container">
        <div class="row">
            <div class="col l6 s12">
            <h5 class="white-text">Footer Content</h5>

            <div class="col l4 offset-l2 s12">
            <h5 class="white-text">Links</h5>
