<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Producto · Pastelería Mil Sabores</title>
</head>
<body>
    <header>
    </header>

    <main>
        <div class="menu">
            <div id="detalle-producto" class="detalle-producto"></div>
        </div>
    </main>

    <div id="carrito-overlay" class="carrito-overlay"></div>
    <aside id="carrito-panel" class="carrito-panel">
        <div class="carrito-panel-header">
            <h4>Tu carro</h4>
            <button id="carrito-cerrar" class="material-icons carrito-cerrar" aria-label="Cerrar carrito">close</button>
        </div>
        <div id="carrito-lista" class="carrito-lista"></div>
        <div class="carrito-panel-footer">
            <div class="carrito-total-fila">
                <span>Total</span>
                <span id="carrito-total">$ 0</span>
            </div>
            <button id="carrito-finalizar" class="btn carrito-finalizar">Finalizar compra</button>
        </div>
    </aside>

    <footer class="page-footer">
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/script.js"></script>
    <script src="js/producto.js"></script>
</body>
</html>
