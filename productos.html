<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
    </header>

    <main>
        <div class="menu">
            <h3 class="titulo-menu">Nuestros productos</h3>
            <div class="layout-productos">
                <aside class="sidebar-filtros">
                    <h4 class="sidebar-titulo">Categorías</h4>
                    <div id="filtros-categoria" class="filtros-lista"></div>
                </aside>

                <section id="productos"></section>
            </div>
        </div>
    </main>

    <!-- carrito-->
    <div id="carrito-overlay" class="carrito-overlay"></div>
    <aside id="carrito-panel" class="carrito-panel">
        <div class="carrito-panel-header">
            <h4>Tu carro</h4>
            <button id="carrito-cerrar" class="material-icons carrito-cerrar" aria-label="Cerrar carrito">close</button>
        </div>
        <div id="carrito-lista" class="carrito-lista"></div>
        <div class="carrito-panel-footer">
            <div class="carrito-total-fila">
                <span>Total</span>
                <span id="carrito-total">$ 0</span>
            </div>
            <button id="carrito-finalizar" class="btn carrito-finalizar">Finalizar compra</button>
        </div>
    </aside>

    <div id="modal-mensaje" class="modal">
        <div class="modal-content">
            <h5>Mensaje personalizado</h5>
            <p>¿Quieres agregar un mensaje para tu torta? (opcional)</p>
            <div class="input-field">
                <textarea id="modal-mensaje-texto" class="materialize-textarea"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button id="modal-mensaje-agregar" class="btn modal-mensaje-boton">Agregar al carro</button>
        </div>
    </div>

    <footer class="page-footer">
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/script.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
